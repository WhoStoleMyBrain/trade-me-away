[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "trade-me-away"
version = "0.1.0"
description = "A fail-closed, auditable spot cryptocurrency trader"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=2.54,<3",
  "coinbase-advanced-py==1.8.4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pandas>=2.2,<4",
  "numpy>=2,<3",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
crypto-trader = "trader.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
